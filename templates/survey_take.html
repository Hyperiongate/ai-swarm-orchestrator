<!DOCTYPE html>
<!--
SURVEY IN A BOX — Employee Survey Page
File: templates/survey_take.html
Created: March 13, 2026
Last Updated: March 26, 2026 — Phase 2: Instructions screen + employee code entry

PURPOSE:
    Employee-facing survey interface. Displays one section at a time
    with Next/Back navigation. Fully anonymous — collects no PII.
    Submits completed responses to /api/survey/take/<token>/submit.

DESIGN:
    - Mobile-first responsive layout
    - One section at a time with progress indicator
    - Questions are optional — employees may skip any question
    - Thank You page on successful submission
    - Graceful handling of closed surveys and duplicate submissions

CHANGELOG:
    - March 26, 2026: Phase 2 — TWO CHANGES ONLY:
      1. showIntro() REPLACED with showInstructions(): The intro card now
         matches the formal CONFIDENTIAL EMPLOYEE SURVEY instructions page
         specified in the Phase 2 handoff. Includes:
         - Confidentiality statement
         - Estimated time (from question count)
         - Instructions bullets
         - 5-digit employee code input field (shown only when the questions
           API returns roster_uploaded=true)
         - Code is validated (5 digits, required if roster) before Begin Survey
         - Code is stored in JS var employeeCode and sent with submit payload
         The function name changed from showIntro to showInstructions. All
         callers updated (goBack when currentSection=0 now calls showInstructions).
      2. submitSurvey() UPDATED: employee_code added to POST body when set.
         No other changes to submit logic.
      NOTE: roster_uploaded is read from the /questions API response (not a
      template variable), so survey_respondent.py route needed no change.

    - March 25, 2026: TWO CHANGES ONLY:
      1. INTRO SCREEN: Added "Questions are optional" and "one answer per
         question" bullets.
      2. goNext() VALIDATION: Removed hard block on unanswered questions.

    - March 13, 2026: Initial creation. Phase 3 of Survey in a Box.

IMPORTANT — JS STRING LITERAL RULE:
    All string literals inside <script> blocks must use only plain ASCII
    characters. Smart/curly quotes and typographic dashes cause silent JS
    syntax errors. Use straight quotes and hyphens only.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Survey -- {{ company_name }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f4f8;
            color: #2d3748;
            min-height: 100vh;
        }

        /* ---- Header ---- */
        .survey-header {
            background: #1a365d;
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .survey-header .logo-text {
            font-size: 13px;
            opacity: 0.8;
            letter-spacing: 0.5px;
        }
        .survey-header .company-name {
            font-size: 17px;
            font-weight: 600;
        }
        .header-divider {
            width: 1px;
            height: 32px;
            background: rgba(255,255,255,0.3);
        }

        /* ---- Progress bar ---- */
        .progress-container {
            background: #e2e8f0;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .progress-bar-track {
            flex: 1;
            height: 6px;
            background: #cbd5e0;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: #3182ce;
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .progress-text {
            font-size: 12px;
            color: #718096;
            white-space: nowrap;
            min-width: 80px;
            text-align: right;
        }

        /* ---- Main content ---- */
        .survey-content {
            max-width: 720px;
            margin: 0 auto;
            padding: 24px 16px 80px;
        }

        /* ---- Section card ---- */
        .section-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 16px;
            overflow: hidden;
        }
        .section-header {
            background: #2b6cb0;
            color: white;
            padding: 14px 20px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
        }
        .section-subtitle {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 2px;
        }
        .section-body {
            padding: 20px;
        }

        /* ---- Questions ---- */
        .question-block {
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
        }
        .question-block:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        .question-number {
            font-size: 11px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .question-text {
            font-size: 15px;
            font-weight: 500;
            color: #2d3748;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        /* ---- Radio / Checkbox options ---- */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .option-item:hover {
            border-color: #3182ce;
            background: #ebf8ff;
        }
        .option-item.selected {
            border-color: #3182ce;
            background: #ebf8ff;
        }
        .option-item input[type="radio"],
        .option-item input[type="checkbox"] {
            accent-color: #3182ce;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .option-label {
            font-size: 14px;
            cursor: pointer;
            flex: 1;
        }

        /* ---- Text input questions ---- */
        .question-textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 7px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.15s;
        }
        .question-textarea:focus {
            outline: none;
            border-color: #3182ce;
        }

        /* ---- Likert scale ---- */
        .likert-scale {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 8px;
        }
        @media (max-width: 500px) {
            .likert-scale {
                grid-template-columns: 1fr 1fr;
            }
        }
        .likert-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 8px;
            border: 1.5px solid #e2e8f0;
            border-radius: 7px;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
        }
        .likert-option:hover {
            border-color: #3182ce;
            background: #ebf8ff;
        }
        .likert-option.selected {
            border-color: #3182ce;
            background: #ebf8ff;
        }
        .likert-option input[type="radio"] {
            accent-color: #3182ce;
            margin-bottom: 5px;
        }
        .likert-label {
            font-size: 12px;
            line-height: 1.3;
        }

        /* ---- Navigation ---- */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0 0;
            gap: 12px;
        }
        .btn {
            padding: 11px 28px;
            border-radius: 7px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
        }
        .btn-primary {
            background: #3182ce;
            color: white;
        }
        .btn-primary:hover {
            background: #2c5282;
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }
        .btn-secondary:hover {
            background: #cbd5e0;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ---- Loading state ---- */
        .loading-screen {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: #3182ce;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---- Instructions card (Phase 2) ---- */
        .instructions-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .instructions-header {
            background: #1a365d;
            color: white;
            padding: 24px 28px 20px;
            text-align: center;
        }
        .instructions-header .confidential-label {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 6px;
        }
        .instructions-header h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .instructions-header .conducted-by {
            font-size: 13px;
            opacity: 0.75;
        }
        .instructions-body {
            padding: 24px 28px;
        }
        .instructions-body h2 {
            font-size: 14px;
            font-weight: 700;
            color: #2d3748;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        .instructions-list {
            list-style: none;
            padding: 0;
            margin-bottom: 24px;
        }
        .instructions-list li {
            font-size: 14px;
            color: #4a5568;
            line-height: 1.6;
            padding: 8px 0 8px 28px;
            border-bottom: 1px solid #f0f4f8;
            position: relative;
        }
        .instructions-list li:last-child {
            border-bottom: none;
        }
        .instructions-list li::before {
            content: attr(data-bullet);
            position: absolute;
            left: 0;
            top: 8px;
            font-size: 15px;
        }

        /* ---- Employee code input ---- */
        .code-section {
            background: #f7fafc;
            border: 1.5px solid #bee3f8;
            border-radius: 8px;
            padding: 18px 20px;
            margin-bottom: 20px;
        }
        .code-section label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #2b6cb0;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .code-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .code-input {
            width: 140px;
            padding: 10px 14px;
            border: 2px solid #bee3f8;
            border-radius: 7px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 6px;
            text-align: center;
            color: #1a365d;
            font-family: 'Courier New', monospace;
            transition: border-color 0.15s;
        }
        .code-input:focus {
            outline: none;
            border-color: #3182ce;
        }
        .code-input.error {
            border-color: #fc8181;
            background: #fff5f5;
        }
        .code-hint {
            font-size: 12px;
            color: #718096;
        }
        .code-error {
            font-size: 13px;
            color: #c53030;
            margin-top: 6px;
            display: none;
        }
        .code-error.visible {
            display: block;
        }

        /* ---- Contact line ---- */
        .contact-line {
            font-size: 13px;
            color: #718096;
            text-align: center;
            margin-bottom: 20px;
        }

        /* ---- Thank you screen ---- */
        .thankyou-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 48px 28px;
            text-align: center;
        }
        .thankyou-icon {
            font-size: 56px;
            margin-bottom: 16px;
        }
        .thankyou-card h1 {
            font-size: 24px;
            color: #1a365d;
            margin-bottom: 12px;
        }
        .thankyou-card p {
            color: #718096;
            font-size: 15px;
            line-height: 1.6;
            max-width: 460px;
            margin: 0 auto 10px;
        }
        .shiftwork-footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            font-size: 12px;
            color: #a0aec0;
        }

        /* ---- Error screen ---- */
        .error-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 48px 28px;
            text-align: center;
        }
        .error-card h1 { color: #c53030; font-size: 22px; margin-bottom: 12px; }
        .error-card p { color: #718096; font-size: 15px; line-height: 1.6; }
    </style>
</head>
<body>

<!-- Header -->
<div class="survey-header">
    <div>
        <div class="logo-text">SHIFTWORK SOLUTIONS LLC</div>
        <div class="company-name">{{ company_name }} &mdash; Employee Survey</div>
    </div>
</div>

<!-- Progress bar (hidden initially) -->
<div class="progress-container" id="progressContainer" style="display:none;">
    <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="progress-text" id="progressText">Section 1</div>
</div>

<!-- Main content -->
<div class="survey-content" id="surveyContent">
    <div class="loading-screen">
        <div class="spinner"></div>
        <p>Loading your survey...</p>
    </div>
</div>

<script>
// ============================================================================
// SURVEY IN A BOX -- Employee Survey JavaScript
// IMPORTANT: All string literals use only plain ASCII characters.
// Smart/curly quotes and typographic dashes cause silent JS syntax errors.
// ============================================================================
var SURVEY_TOKEN  = {{ token | tojson }};
var COMPANY_NAME  = {{ company_name | tojson }};

var surveyData     = null;   // {sections, total_questions, roster_uploaded, roster_count}
var currentSection = -1;     // -1 = instructions, sections.length = review/submit
var allAnswers     = {};     // {short_label: answer_text}
var employeeCode   = '';     // Phase 2: 5-digit code entered by employee

// ---------------------------------------------------------------------------
// INIT
// ---------------------------------------------------------------------------
function init() {
    fetch('/api/survey/take/' + SURVEY_TOKEN + '/questions')
        .then(function(resp) { return resp.json(); })
        .then(function(data) {
            if (!data.success) {
                showError(data.error || 'This survey is not currently available.');
                return;
            }
            surveyData = data;
            showInstructions();
        })
        .catch(function() {
            showError('Unable to load the survey. Please check your internet connection and try again.');
        });
}

// ---------------------------------------------------------------------------
// SCREENS
// ---------------------------------------------------------------------------

/*
 * showInstructions() — Phase 2 replacement for showIntro()
 *
 * Renders the CONFIDENTIAL EMPLOYEE SURVEY instructions page.
 * If the project has a roster (surveyData.roster_uploaded = true),
 * shows the 5-digit code input field and validates it before
 * allowing the employee to proceed to the survey questions.
 * If no roster, the code field is hidden and Begin Survey proceeds directly.
 */
function showInstructions() {
    currentSection = -1;
    hideProgress();

    var totalQ      = surveyData.total_questions;
    var sections    = surveyData.sections || [];
    var estMins     = Math.ceil(totalQ / 8);
    var hasRoster   = surveyData.roster_uploaded === true;

    // Build the employee code section (only when roster exists)
    var codeSectionHtml = '';
    if (hasRoster) {
        codeSectionHtml =
            '<div class="code-section">' +
                '<label>Your 5-Digit Survey Code</label>' +
                '<div class="code-input-row">' +
                    '<input type="text" id="employeeCodeInput" class="code-input"' +
                    '       maxlength="5" inputmode="numeric" pattern="[0-9]*"' +
                    '       placeholder="00000"' +
                    '       oninput="this.value=this.value.replace(/[^0-9]/g,\'\').slice(0,5)"' +
                    '       onkeydown="if(event.key===\'Enter\')beginSurvey()" />' +
                    '<span class="code-hint">Enter the code from your<br>code sheet</span>' +
                '</div>' +
                '<div class="code-error" id="codeError">Please enter your 5-digit survey code before continuing.</div>' +
            '</div>';
    }

    setContent(
        '<div class="instructions-card">' +
            '<div class="instructions-header">' +
                '<div class="confidential-label">Confidential Employee Survey</div>' +
                '<h1>' + escHtml(COMPANY_NAME) + '</h1>' +
                '<div class="conducted-by">Conducted by Shiftwork Solutions LLC</div>' +
            '</div>' +
            '<div class="instructions-body">' +
                '<h2>Instructions</h2>' +
                '<ul class="instructions-list">' +
                    '<li data-bullet="&#128274;">' +
                        '<strong>This survey is confidential.</strong> Your individual responses will not be shared with management. Results are reported only in aggregate.' +
                    '</li>' +
                    (hasRoster
                        ? '<li data-bullet="&#128273;">' +
                            'Enter your <strong>5-digit survey code</strong> below. This code is used only to prevent duplicate submissions. It cannot be linked to your identity by anyone at ' + escHtml(COMPANY_NAME) + '.' +
                          '</li>'
                        : '') +
                    '<li data-bullet="&#9745;">' +
                        '<strong>Most questions are optional.</strong> If you prefer not to answer a question, you may skip it.' +
                    '</li>' +
                    '<li data-bullet="&#128221;">' +
                        'Select <strong>one answer per question</strong> unless otherwise noted.' +
                    '</li>' +
                    '<li data-bullet="&#8987;">' +
                        'The survey takes approximately <strong>' + estMins + '-' + (estMins + 5) + ' minutes</strong> to complete (' + totalQ + ' questions across ' + sections.length + ' sections).' +
                    '</li>' +
                    '<li data-bullet="&#128222;">' +
                        'If you have questions about the survey, contact: <strong>Shiftwork Solutions LLC -- (415) 265-1621</strong>' +
                    '</li>' +
                '</ul>' +
                codeSectionHtml +
                '<div class="contact-line">' +
                    'This survey is administered by Shiftwork Solutions LLC on behalf of ' + escHtml(COMPANY_NAME) + '.' +
                '</div>' +
                '<div style="text-align:center;">' +
                    '<button class="btn btn-primary" onclick="beginSurvey()">Begin Survey &#8594;</button>' +
                '</div>' +
            '</div>' +
        '</div>'
    );
}

/*
 * beginSurvey() — validates employee code (if required) then starts survey
 */
function beginSurvey() {
    var hasRoster = surveyData && surveyData.roster_uploaded === true;

    if (hasRoster) {
        var input    = document.getElementById('employeeCodeInput');
        var errEl    = document.getElementById('codeError');
        var codeVal  = input ? input.value.trim() : '';

        // Clear prior error state
        if (input)  input.classList.remove('error');
        if (errEl)  errEl.classList.remove('visible');

        if (!codeVal || codeVal.length !== 5 || !/^\d{5}$/.test(codeVal)) {
            if (input) input.classList.add('error');
            if (errEl) {
                errEl.textContent = 'Please enter your 5-digit survey code before continuing.';
                errEl.classList.add('visible');
            }
            return;
        }

        employeeCode = codeVal;
    } else {
        employeeCode = '';
    }

    currentSection = 0;
    showCurrentSection();
}

function showCurrentSection() {
    var sections = surveyData.sections || [];
    if (currentSection >= sections.length) {
        showReviewAndSubmit();
        return;
    }

    var section   = sections[currentSection];
    var questions = section.questions || [];
    updateProgress();

    var questionsHtml = '';
    var qNum = getGlobalQuestionNumber(currentSection, 0);

    questions.forEach(function(q, idx) {
        questionsHtml += buildQuestionHtml(q, qNum + idx);
    });

    var isLast  = (currentSection === sections.length - 1);
    var isFirst = (currentSection === 0);
    var nextLabel = isLast ? 'Review &amp; Submit &#8594;' : 'Next &#8594;';

    setContent(
        '<div class="section-card">' +
            '<div class="section-header">' +
                '<div class="section-title">' + escHtml(section.name || section.category || section.title || 'Survey Questions') + '</div>' +
                '<div class="section-subtitle">Section ' + (currentSection + 1) + ' of ' + sections.length + '</div>' +
            '</div>' +
            '<div class="section-body">' +
                questionsHtml +
            '</div>' +
        '</div>' +
        '<div class="nav-bar">' +
            '<button class="btn btn-secondary" onclick="goBack()">' +
                (isFirst ? '&#8592; Instructions' : '&#8592; Back') +
            '</button>' +
            '<button class="btn btn-primary" onclick="goNext()">' +
                nextLabel +
            '</button>' +
        '</div>'
    );

    restoreAnswers(questions);
    bindOptionHandlers();
    window.scrollTo(0, 0);
}

function showReviewAndSubmit() {
    updateProgress(true);
    var sections = surveyData.sections || [];
    var totalQ   = surveyData.total_questions;
    var answered = Object.keys(allAnswers).filter(function(k) { return allAnswers[k]; }).length;
    var pct      = Math.round((answered / totalQ) * 100);

    setContent(
        '<div class="section-card">' +
            '<div class="section-header">' +
                '<div class="section-title">Review &amp; Submit</div>' +
                '<div class="section-subtitle">You answered ' + answered + ' of ' + totalQ + ' questions (' + pct + '%)</div>' +
            '</div>' +
            '<div class="section-body">' +
                '<p style="font-size:15px; color:#4a5568; line-height:1.6; margin-bottom:20px;">' +
                    'Please review your responses below. Click <strong>Back</strong> to make changes, ' +
                    'or click <strong>Submit Survey</strong> when you are ready. Once submitted, ' +
                    'your responses cannot be changed.' +
                '</p>' +
                buildReviewHtml(sections) +
            '</div>' +
        '</div>' +
        '<div class="nav-bar">' +
            '<button class="btn btn-secondary" onclick="goBackToLastSection()">&#8592; Back</button>' +
            '<button class="btn btn-primary" id="submitBtn" onclick="submitSurvey()">Submit Survey &#10003;</button>' +
        '</div>'
    );
    window.scrollTo(0, 0);
}

function showThankYou() {
    hideProgress();
    setContent(
        '<div class="thankyou-card">' +
            '<div class="thankyou-icon">&#10003;</div>' +
            '<h1>Thank You!</h1>' +
            '<p>Your response has been recorded anonymously. Your feedback is valuable and will help shape decisions about your work schedule and work environment.</p>' +
            '<p>You may now close this window.</p>' +
            '<div class="shiftwork-footer">' +
                'Survey administered by Shiftwork Solutions LLC &nbsp;|&nbsp;' +
                '<a href="https://shift-work.com" style="color:#a0aec0;">shift-work.com</a>' +
            '</div>' +
        '</div>'
    );
}

function showError(message) {
    hideProgress();
    setContent(
        '<div class="error-card">' +
            '<h1>Survey Unavailable</h1>' +
            '<p>' + escHtml(message) + '</p>' +
        '</div>'
    );
}

// ---------------------------------------------------------------------------
// QUESTION RENDERING
// ---------------------------------------------------------------------------
function buildQuestionHtml(q, qNum) {
    var shortLabel = q.short_label || q.id || '';
    var fullText   = q.full_text || q.text || shortLabel;
    var qType      = (q.question_type || q.type || 'radio').toLowerCase();
    var options    = q.options || q.answer_options || [];
    var savedVal   = allAnswers[shortLabel] || '';

    var optionsHtml = '';

    if (qType === 'likert' || qType === 'scale') {
        optionsHtml = '<div class="likert-scale">';
        options.forEach(function(opt) {
            var optText  = typeof opt === 'string' ? opt : (opt.text || opt.label || String(opt));
            var checked  = savedVal === optText ? 'checked' : '';
            var selClass = savedVal === optText ? 'selected' : '';
            optionsHtml +=
                '<label class="likert-option ' + selClass + '" data-short="' + escHtml(shortLabel) + '" data-val="' + escHtml(optText) + '">' +
                    '<input type="radio" name="q_' + escAttr(shortLabel) + '" value="' + escAttr(optText) + '" ' + checked + '>' +
                    '<span class="likert-label">' + escHtml(optText) + '</span>' +
                '</label>';
        });
        optionsHtml += '</div>';

    } else if (qType === 'checkbox' || qType === 'multi') {
        optionsHtml = '<div class="options-list">';
        var savedArr = savedVal ? savedVal.split('|') : [];
        options.forEach(function(opt) {
            var optText  = typeof opt === 'string' ? opt : (opt.text || opt.label || String(opt));
            var checked  = savedArr.indexOf(optText) !== -1 ? 'checked' : '';
            var selClass = savedArr.indexOf(optText) !== -1 ? 'selected' : '';
            optionsHtml +=
                '<label class="option-item ' + selClass + '" data-short="' + escHtml(shortLabel) + '" data-val="' + escHtml(optText) + '" data-type="checkbox">' +
                    '<input type="checkbox" name="q_' + escAttr(shortLabel) + '" value="' + escAttr(optText) + '" ' + checked + '>' +
                    '<span class="option-label">' + escHtml(optText) + '</span>' +
                '</label>';
        });
        optionsHtml += '</div>';

    } else if (qType === 'text' || qType === 'open') {
        optionsHtml =
            '<textarea class="question-textarea"' +
                ' name="q_' + escAttr(shortLabel) + '"' +
                ' data-short="' + escHtml(shortLabel) + '"' +
                ' placeholder="Type your response here (optional)..."' +
                ' oninput="allAnswers[\'' + escJs(shortLabel) + '\'] = this.value.trim()"' +
            '>' + escHtml(savedVal) + '</textarea>';

    } else {
        // Default: radio list
        optionsHtml = '<div class="options-list">';
        options.forEach(function(opt) {
            var optText  = typeof opt === 'string' ? opt : (opt.text || opt.label || String(opt));
            var checked  = savedVal === optText ? 'checked' : '';
            var selClass = savedVal === optText ? 'selected' : '';
            optionsHtml +=
                '<label class="option-item ' + selClass + '" data-short="' + escHtml(shortLabel) + '" data-val="' + escHtml(optText) + '">' +
                    '<input type="radio" name="q_' + escAttr(shortLabel) + '" value="' + escAttr(optText) + '" ' + checked + '>' +
                    '<span class="option-label">' + escHtml(optText) + '</span>' +
                '</label>';
        });
        optionsHtml += '</div>';
    }

    return (
        '<div class="question-block" data-short="' + escHtml(shortLabel) + '">' +
            '<div class="question-number">Question ' + qNum + '</div>' +
            '<div class="question-text">' + escHtml(fullText) + '</div>' +
            optionsHtml +
        '</div>'
    );
}

function buildReviewHtml(sections) {
    var html = '';
    sections.forEach(function(section) {
        var questions       = section.questions || [];
        var sectionAnswered = questions.filter(function(q) {
            return allAnswers[q.short_label || q.id];
        }).length;
        html +=
            '<div style="margin-bottom:20px;">' +
                '<div style="font-weight:600; color:#2b6cb0; margin-bottom:8px; font-size:14px; text-transform:uppercase; letter-spacing:0.5px;">' +
                    escHtml(section.name || section.category || section.title || 'Questions') +
                    ' <span style="color:#a0aec0; font-weight:400;">(' + sectionAnswered + '/' + questions.length + ' answered)</span>' +
                '</div>';
        questions.forEach(function(q) {
            var shortLabel = q.short_label || q.id || '';
            var fullText   = q.full_text || q.text || shortLabel;
            var ans        = allAnswers[shortLabel] || '';
            var ansDisplay = ans || '<em style="color:#a0aec0;">Skipped</em>';
            var ansColor   = ans ? '#2d3748' : '#a0aec0';
            html +=
                '<div style="display:flex; justify-content:space-between; align-items:flex-start; padding:8px 0; border-bottom:1px solid #f0f4f8; gap:12px;">' +
                    '<div style="font-size:13px; color:#4a5568; flex:1;">' + escHtml(fullText) + '</div>' +
                    '<div style="font-size:13px; color:' + ansColor + '; font-weight:500; text-align:right; max-width:220px;">' +
                        (ans ? escHtml(ans) : ansDisplay) +
                    '</div>' +
                '</div>';
        });
        html += '</div>';
    });
    return html;
}

// ---------------------------------------------------------------------------
// ANSWER BINDING
// ---------------------------------------------------------------------------
function bindOptionHandlers() {
    // Radio / single-select
    document.querySelectorAll('label.option-item:not([data-type="checkbox"]), label.likert-option').forEach(function(label) {
        label.addEventListener('click', function() {
            var shortLabel = this.dataset.short;
            var val        = this.dataset.val;
            allAnswers[shortLabel] = val;

            document.querySelectorAll('label[data-short="' + CSS.escape(shortLabel) + '"]').forEach(function(l) {
                l.classList.remove('selected');
            });
            this.classList.add('selected');
            var inp = this.querySelector('input[type="radio"]');
            if (inp) inp.checked = true;
        });
    });

    // Checkboxes
    document.querySelectorAll('label.option-item[data-type="checkbox"]').forEach(function(label) {
        label.addEventListener('click', function(e) {
            if (e.target.tagName === 'INPUT') return;
            var inp = this.querySelector('input[type="checkbox"]');
            if (inp) { inp.checked = !inp.checked; inp.dispatchEvent(new Event('change')); }
        });
        var inp = label.querySelector('input[type="checkbox"]');
        if (inp) {
            inp.addEventListener('change', function() {
                var shortLabel  = label.dataset.short;
                var val         = label.dataset.val;
                var currentArr  = allAnswers[shortLabel] ? allAnswers[shortLabel].split('|') : [];
                if (this.checked) {
                    if (currentArr.indexOf(val) === -1) currentArr.push(val);
                    label.classList.add('selected');
                } else {
                    var idx = currentArr.indexOf(val);
                    if (idx > -1) currentArr.splice(idx, 1);
                    label.classList.remove('selected');
                }
                allAnswers[shortLabel] = currentArr.join('|');
            });
        }
    });
}

function restoreAnswers(questions) {
    questions.forEach(function(q) {
        var shortLabel = q.short_label || q.id || '';
        var savedVal   = allAnswers[shortLabel];
        if (!savedVal) return;

        var qType = (q.question_type || q.type || 'radio').toLowerCase();
        if (qType !== 'checkbox' && qType !== 'multi') {
            var inp = document.querySelector('input[name="q_' + CSS.escape(shortLabel) + '"][value="' + CSS.escape(savedVal) + '"]');
            if (inp) {
                inp.checked = true;
                if (inp.closest('label')) inp.closest('label').classList.add('selected');
            }
        }
    });
}

// ---------------------------------------------------------------------------
// NAVIGATION
// goBack() returns to showInstructions() (not showIntro) when at section 0
// ---------------------------------------------------------------------------
function goNext() {
    currentSection++;
    showCurrentSection();
}

function goBack() {
    if (currentSection <= 0) {
        showInstructions();
        return;
    }
    currentSection--;
    showCurrentSection();
}

function goBackToLastSection() {
    var sections = surveyData.sections || [];
    currentSection = sections.length - 1;
    showCurrentSection();
}

// ---------------------------------------------------------------------------
// SUBMIT
// Phase 2: employee_code included in POST body when set
// ---------------------------------------------------------------------------
function submitSurvey() {
    var submitBtn = document.getElementById('submitBtn');
    if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting...';
    }

    var finalAnswers = {};
    Object.keys(allAnswers).forEach(function(k) {
        var v = allAnswers[k];
        if (v && v.trim()) {
            finalAnswers[k] = v.indexOf('|') !== -1 ? v.split('|').join('; ') : v;
        }
    });

    // Phase 2: include employee_code in payload when set
    var payload = { answers: finalAnswers };
    if (employeeCode) {
        payload.employee_code = employeeCode;
    }

    fetch('/api/survey/take/' + SURVEY_TOKEN + '/submit', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload)
    })
    .then(function(resp) {
        return resp.json().then(function(data) {
            return { status: resp.status, data: data };
        });
    })
    .then(function(result) {
        if (result.data.success) {
            showThankYou();
        } else if (result.status === 409) {
            showError('It looks like this survey code has already been used, or you have already submitted a response. Only one response per person is allowed. Thank you!');
        } else {
            showError(result.data.error || 'An error occurred. Please try again.');
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Survey';
            }
        }
    })
    .catch(function() {
        showError('Network error. Please check your connection and try again.');
        if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit Survey';
        }
    });
}

// ---------------------------------------------------------------------------
// PROGRESS BAR
// ---------------------------------------------------------------------------
function updateProgress(onReview) {
    var sections  = surveyData ? surveyData.sections || [] : [];
    var container = document.getElementById('progressContainer');
    if (!container) return;
    container.style.display = 'flex';

    var pct, text;
    if (onReview) {
        pct  = 100;
        text = 'Review & Submit';
    } else {
        pct  = sections.length > 0 ? Math.round((currentSection / sections.length) * 100) : 0;
        text = 'Section ' + (currentSection + 1) + ' of ' + sections.length;
    }

    var fill   = document.getElementById('progressFill');
    var textEl = document.getElementById('progressText');
    if (fill)   fill.style.width = pct + '%';
    if (textEl) textEl.textContent = text;
}

function hideProgress() {
    var container = document.getElementById('progressContainer');
    if (container) container.style.display = 'none';
}

// ---------------------------------------------------------------------------
// HELPERS
// ---------------------------------------------------------------------------
function getGlobalQuestionNumber(sectionIdx, questionIdx) {
    var sections = surveyData ? surveyData.sections || [] : [];
    var count = 1;
    for (var i = 0; i < sectionIdx; i++) {
        count += (sections[i].questions || []).length;
    }
    return count + questionIdx;
}

function setContent(html) {
    document.getElementById('surveyContent').innerHTML = html;
}

function escHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function escAttr(str) { return escHtml(str); }

function escJs(str) {
    if (!str) return '';
    return String(str)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"');
}

// ---------------------------------------------------------------------------
// BOOT
// ---------------------------------------------------------------------------
document.addEventListener('DOMContentLoaded', init);
</script>
