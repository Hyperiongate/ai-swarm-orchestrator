<!DOCTYPE html>
<!--
SURVEY IN A BOX — Survey Closed / Not Available Page
File: templates/survey_closed.html
Created: March 13, 2026
Last Updated: March 13, 2026 — Phase 3: Online Survey Engine

PURPOSE:
    Shown to employees when a survey link is invalid, not yet open,
    or has been closed. Receives the message variable from the route.

CHANGELOG:
    - March 13, 2026: Initial creation. Phase 3 of Survey in a Box.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey — Shiftwork Solutions LLC</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f4f8;
            color: #2d3748;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .survey-header {
            background: #1a365d;
            color: white;
            padding: 16px 24px;
        }
        .logo-text { font-size: 13px; opacity: 0.8; letter-spacing: 0.5px; }
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 48px 36px;
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        .icon { font-size: 52px; margin-bottom: 20px; }
        h1 { font-size: 22px; color: #1a365d; margin-bottom: 14px; }
        p { font-size: 15px; color: #718096; line-height: 1.6; }
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="survey-header">
        <div class="logo-text">SHIFTWORK SOLUTIONS LLC</div>
    </div>
    <div class="main">
        <div class="card">
            <div class="icon">📋</div>
            <h1>Survey Unavailable</h1>
            <p>{{ message }}</p>
        </div>
    </div>
    <div class="footer">
        Shiftwork Solutions LLC &nbsp;|&nbsp;
        <a href="https://shift-work.com" style="color:#a0aec0;">shift-work.com</a>
    </div>
</body>
</html>
<!-- I did no harm and this file is not truncated -->
