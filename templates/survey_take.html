<!DOCTYPE html>
<!--
SURVEY IN A BOX — Employee Survey Page
File: templates/survey_take.html
Created: March 13, 2026
Last Updated: March 13, 2026 — Phase 3: Online Survey Engine

PURPOSE:
    Employee-facing survey interface. Displays one section at a time
    with Next/Back navigation. Fully anonymous — collects no PII.
    Submits completed responses to /api/survey/take/<token>/submit.

DESIGN:
    - Mobile-first responsive layout
    - One section at a time with progress indicator
    - Required question enforcement before advancing sections
    - Thank You page on successful submission
    - Graceful handling of closed surveys and duplicate submissions

CHANGELOG:
    - March 13, 2026: Initial creation. Phase 3 of Survey in a Box.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Survey — {{ company_name }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f4f8;
            color: #2d3748;
            min-height: 100vh;
        }

        /* ---- Header ---- */
        .survey-header {
            background: #1a365d;
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .survey-header .logo-text {
            font-size: 13px;
            opacity: 0.8;
            letter-spacing: 0.5px;
        }
        .survey-header .company-name {
            font-size: 17px;
            font-weight: 600;
        }
        .header-divider {
            width: 1px;
            height: 32px;
            background: rgba(255,255,255,0.3);
        }

        /* ---- Progress bar ---- */
        .progress-container {
            background: #e2e8f0;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .progress-bar-track {
            flex: 1;
            height: 6px;
            background: #cbd5e0;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: #3182ce;
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .progress-text {
            font-size: 12px;
            color: #718096;
            white-space: nowrap;
            min-width: 80px;
            text-align: right;
        }

        /* ---- Main content ---- */
        .survey-content {
            max-width: 720px;
            margin: 0 auto;
            padding: 24px 16px 80px;
        }

        /* ---- Section card ---- */
        .section-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 16px;
            overflow: hidden;
        }
        .section-header {
            background: #2b6cb0;
            color: white;
            padding: 14px 20px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
        }
        .section-subtitle {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 2px;
        }
        .section-body {
            padding: 20px;
        }

        /* ---- Questions ---- */
        .question-block {
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
        }
        .question-block:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        .question-number {
            font-size: 11px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .question-text {
            font-size: 15px;
            font-weight: 500;
            color: #2d3748;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .question-required {
            color: #e53e3e;
            margin-left: 3px;
        }

        /* ---- Radio / Checkbox options ---- */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .option-item:hover {
            border-color: #3182ce;
            background: #ebf8ff;
        }
        .option-item.selected {
            border-color: #3182ce;
            background: #ebf8ff;
        }
        .option-item input[type="radio"],
        .option-item input[type="checkbox"] {
            accent-color: #3182ce;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .option-label {
            font-size: 14px;
            cursor: pointer;
            flex: 1;
        }

        /* ---- Text input questions ---- */
        .question-textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 7px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.15s;
        }
        .question-textarea:focus {
            outline: none;
            border-color: #3182ce;
        }

        /* ---- Likert scale ---- */
        .likert-scale {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 8px;
        }
        @media (max-width: 500px) {
            .likert-scale {
                grid-template-columns: 1fr 1fr;
            }
        }
        .likert-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 8px;
            border: 1.5px solid #e2e8f0;
            border-radius: 7px;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
        }
        .likert-option:hover {
            border-color: #3182ce;
            background: #ebf8ff;
        }
        .likert-option.selected {
            border-color: #3182ce;
            background: #ebf8ff;
        }
        .likert-option input[type="radio"] {
            accent-color: #3182ce;
            margin-bottom: 5px;
        }
        .likert-label {
            font-size: 12px;
            line-height: 1.3;
        }

        /* ---- Navigation ---- */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0 0;
            gap: 12px;
        }
        .btn {
            padding: 11px 28px;
            border-radius: 7px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
        }
        .btn-primary {
            background: #3182ce;
            color: white;
        }
        .btn-primary:hover {
            background: #2c5282;
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }
        .btn-secondary:hover {
            background: #cbd5e0;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ---- Validation error ---- */
        .validation-error {
            background: #fff5f5;
            border: 1px solid #fc8181;
            color: #c53030;
            border-radius: 7px;
            padding: 12px 16px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }

        /* ---- Loading state ---- */
        .loading-screen {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: #3182ce;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---- Intro card ---- */
        .intro-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 32px 28px;
            text-align: center;
        }
        .intro-card h1 {
            font-size: 22px;
            color: #1a365d;
            margin-bottom: 12px;
        }
        .intro-card p {
            color: #718096;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .intro-card .intro-bullets {
            text-align: left;
            background: #f7fafc;
            border-radius: 8px;
            padding: 16px 20px;
            margin: 16px 0;
        }
        .intro-card .intro-bullets li {
            font-size: 14px;
            color: #4a5568;
            margin-bottom: 6px;
            margin-left: 16px;
            line-height: 1.5;
        }

        /* ---- Thank you screen ---- */
        .thankyou-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 48px 28px;
            text-align: center;
        }
        .thankyou-icon {
            font-size: 56px;
            margin-bottom: 16px;
        }
        .thankyou-card h1 {
            font-size: 24px;
            color: #1a365d;
            margin-bottom: 12px;
        }
        .thankyou-card p {
            color: #718096;
            font-size: 15px;
            line-height: 1.6;
            max-width: 460px;
            margin: 0 auto 10px;
        }
        .shiftwork-footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            font-size: 12px;
            color: #a0aec0;
        }

        /* ---- Error screen ---- */
        .error-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 48px 28px;
            text-align: center;
        }
        .error-card h1 { color: #c53030; font-size: 22px; margin-bottom: 12px; }
        .error-card p { color: #718096; font-size: 15px; line-height: 1.6; }
    </style>
</head>
<body>

<!-- Header -->
<div class="survey-header">
    <div>
        <div class="logo-text">SHIFTWORK SOLUTIONS LLC</div>
        <div class="company-name">{{ company_name }} — Employee Survey</div>
    </div>
</div>

<!-- Progress bar (hidden initially) -->
<div class="progress-container" id="progressContainer" style="display:none;">
    <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="progress-text" id="progressText">Section 1</div>
</div>

<!-- Main content -->
<div class="survey-content" id="surveyContent">
    <div class="loading-screen">
        <div class="spinner"></div>
        <p>Loading your survey…</p>
    </div>
</div>

<script>
// ============================================================================
// SURVEY IN A BOX — Employee Survey JavaScript
// ============================================================================
const SURVEY_TOKEN  = {{ token | tojson }};
const COMPANY_NAME  = {{ company_name | tojson }};

let surveyData      = null;   // {sections, total_questions}
let currentSection  = -1;     // -1 = intro, sections.length = thank you
let allAnswers      = {};     // {short_label: answer_text}

// ---------------------------------------------------------------------------
// INIT
// ---------------------------------------------------------------------------
async function init() {
    try {
        const resp = await fetch(`/api/survey/take/${SURVEY_TOKEN}/questions`);
        const data = await resp.json();

        if (!data.success) {
            showError(data.error || 'This survey is not currently available.');
            return;
        }

        surveyData = data;
        showIntro();
    } catch (err) {
        showError('Unable to load the survey. Please check your internet connection and try again.');
    }
}

// ---------------------------------------------------------------------------
// SCREENS
// ---------------------------------------------------------------------------
function showIntro() {
    currentSection = -1;
    hideProgress();
    const totalQ  = surveyData.total_questions;
    const sections = surveyData.sections || [];
    const estMins = Math.ceil(totalQ / 8);

    setContent(`
        <div class="intro-card">
            <h1>Welcome to the ${escHtml(COMPANY_NAME)} Employee Survey</h1>
            <p>Your feedback matters. This survey helps leadership understand what's working and what can be improved about your work schedule and work environment.</p>
            <div class="intro-bullets">
                <ul>
                    <li><strong>Completely anonymous</strong> — your name is never collected or stored.</li>
                    <li><strong>${totalQ} questions</strong> across ${sections.length} sections — estimated ${estMins}–${estMins + 2} minutes.</li>
                    <li>You can go <strong>Back</strong> to change answers before submitting.</li>
                    <li>Your responses are saved only when you click <strong>Submit</strong> on the final page.</li>
                </ul>
            </div>
            <p style="font-size:13px; color:#a0aec0;">This survey is administered by Shiftwork Solutions LLC on behalf of ${escHtml(COMPANY_NAME)}.</p>
            <div style="margin-top:24px;">
                <button class="btn btn-primary" onclick="startSurvey()">Begin Survey →</button>
            </div>
        </div>
    `);
}

function startSurvey() {
    currentSection = 0;
    showCurrentSection();
}

function showCurrentSection() {
    const sections = surveyData.sections || [];
    if (currentSection >= sections.length) {
        showReviewAndSubmit();
        return;
    }

    const section  = sections[currentSection];
    const questions = section.questions || [];
    updateProgress();

    // Build question HTML
    let questionsHtml = '';
    let qNum = getGlobalQuestionNumber(currentSection, 0);

    questions.forEach((q, idx) => {
        questionsHtml += buildQuestionHtml(q, qNum + idx);
    });

    const isLast   = currentSection === sections.length - 1;
    const isFirst  = currentSection === 0;
    const nextLabel = isLast ? 'Review & Submit →' : 'Next →';

    setContent(`
        <div id="validationError" class="validation-error">
            Please answer all questions before continuing.
        </div>
        <div class="section-card">
            <div class="section-header">
                <div class="section-title">${escHtml(section.name || section.category || 'Survey Questions')}</div>
                <div class="section-subtitle">Section ${currentSection + 1} of ${sections.length}</div>
            </div>
            <div class="section-body">
                ${questionsHtml}
            </div>
        </div>
        <div class="nav-bar">
            <button class="btn btn-secondary" onclick="goBack()" ${isFirst ? 'onclick="showIntro()"' : ''}>
                ${isFirst ? '← Introduction' : '← Back'}
            </button>
            <button class="btn btn-primary" onclick="goNext()">
                ${nextLabel}
            </button>
        </div>
    `);

    // Restore any previously saved answers
    restoreAnswers(questions);
    // Bind click handlers
    bindOptionHandlers();
    window.scrollTo(0, 0);
}

function showReviewAndSubmit() {
    updateProgress(true);
    const sections = surveyData.sections || [];
    const totalQ   = surveyData.total_questions;
    const answered = Object.keys(allAnswers).length;
    const pct      = Math.round((answered / totalQ) * 100);

    setContent(`
        <div id="validationError" class="validation-error">
            Please answer all questions before submitting.
        </div>
        <div class="section-card">
            <div class="section-header">
                <div class="section-title">Review &amp; Submit</div>
                <div class="section-subtitle">You answered ${answered} of ${totalQ} questions (${pct}%)</div>
            </div>
            <div class="section-body">
                <p style="font-size:15px; color:#4a5568; line-height:1.6; margin-bottom:20px;">
                    Please review your responses below. Click <strong>Back</strong> to make changes,
                    or click <strong>Submit Survey</strong> when you are ready. Once submitted,
                    your responses cannot be changed.
                </p>
                ${buildReviewHtml(sections)}
            </div>
        </div>
        <div class="nav-bar">
            <button class="btn btn-secondary" onclick="goBackToLastSection()">← Back</button>
            <button class="btn btn-primary" id="submitBtn" onclick="submitSurvey()">
                Submit Survey ✓
            </button>
        </div>
    `);
    window.scrollTo(0, 0);
}

function showThankYou() {
    hideProgress();
    setContent(`
        <div class="thankyou-card">
            <div class="thankyou-icon">✅</div>
            <h1>Thank You!</h1>
            <p>Your response has been recorded anonymously. Your feedback is valuable and will help shape decisions about your work schedule and environment.</p>
            <p>You may now close this window.</p>
            <div class="shiftwork-footer">
                Survey administered by Shiftwork Solutions LLC &nbsp;|&nbsp;
                <a href="https://shift-work.com" style="color:#a0aec0;">shift-work.com</a>
            </div>
        </div>
    `);
}

function showError(message) {
    hideProgress();
    setContent(`
        <div class="error-card">
            <h1>Survey Unavailable</h1>
            <p>${escHtml(message)}</p>
        </div>
    `);
}

// ---------------------------------------------------------------------------
// QUESTION RENDERING
// ---------------------------------------------------------------------------
function buildQuestionHtml(q, qNum) {
    const shortLabel = q.short_label || q.id || '';
    const fullText   = q.full_text || q.text || shortLabel;
    const qType      = (q.question_type || q.type || 'radio').toLowerCase();
    const options    = q.options || q.answer_options || [];
    const savedVal   = allAnswers[shortLabel] || '';

    let optionsHtml = '';

    if (qType === 'likert' || qType === 'scale') {
        optionsHtml = `<div class="likert-scale">`;
        options.forEach((opt, i) => {
            const optText = typeof opt === 'string' ? opt : (opt.text || opt.label || String(opt));
            const checked = savedVal === optText ? 'checked' : '';
            const selClass = savedVal === optText ? 'selected' : '';
            optionsHtml += `
                <label class="likert-option ${selClass}" data-short="${escHtml(shortLabel)}" data-val="${escHtml(optText)}">
                    <input type="radio" name="q_${escAttr(shortLabel)}" value="${escAttr(optText)}" ${checked}>
                    <span class="likert-label">${escHtml(optText)}</span>
                </label>`;
        });
        optionsHtml += `</div>`;

    } else if (qType === 'checkbox' || qType === 'multi') {
        optionsHtml = `<div class="options-list">`;
        const savedArr = savedVal ? savedVal.split('|') : [];
        options.forEach((opt) => {
            const optText = typeof opt === 'string' ? opt : (opt.text || opt.label || String(opt));
            const checked = savedArr.includes(optText) ? 'checked' : '';
            const selClass = savedArr.includes(optText) ? 'selected' : '';
            optionsHtml += `
                <label class="option-item ${selClass}" data-short="${escHtml(shortLabel)}" data-val="${escHtml(optText)}" data-type="checkbox">
                    <input type="checkbox" name="q_${escAttr(shortLabel)}" value="${escAttr(optText)}" ${checked}>
                    <span class="option-label">${escHtml(optText)}</span>
                </label>`;
        });
        optionsHtml += `</div>`;

    } else if (qType === 'text' || qType === 'open') {
        optionsHtml = `<textarea class="question-textarea"
            name="q_${escAttr(shortLabel)}"
            data-short="${escHtml(shortLabel)}"
            placeholder="Type your response here…"
            oninput="allAnswers['${escJs(shortLabel)}'] = this.value.trim()"
        >${escHtml(savedVal)}</textarea>`;

    } else {
        // Default: radio list
        optionsHtml = `<div class="options-list">`;
        options.forEach((opt) => {
            const optText = typeof opt === 'string' ? opt : (opt.text || opt.label || String(opt));
            const checked = savedVal === optText ? 'checked' : '';
            const selClass = savedVal === optText ? 'selected' : '';
            optionsHtml += `
                <label class="option-item ${selClass}" data-short="${escHtml(shortLabel)}" data-val="${escHtml(optText)}">
                    <input type="radio" name="q_${escAttr(shortLabel)}" value="${escAttr(optText)}" ${checked}>
                    <span class="option-label">${escHtml(optText)}</span>
                </label>`;
        });
        optionsHtml += `</div>`;
    }

    return `
        <div class="question-block" data-short="${escHtml(shortLabel)}">
            <div class="question-number">Question ${qNum}</div>
            <div class="question-text">${escHtml(fullText)}</div>
            ${optionsHtml}
        </div>`;
}

function buildReviewHtml(sections) {
    let html = '';
    sections.forEach((section) => {
        const questions = section.questions || [];
        const sectionAnswered = questions.filter(q => allAnswers[q.short_label || q.id]).length;
        html += `<div style="margin-bottom:20px;">
            <div style="font-weight:600; color:#2b6cb0; margin-bottom:8px; font-size:14px; text-transform:uppercase; letter-spacing:0.5px;">
                ${escHtml(section.name || section.category || 'Questions')}
                <span style="color:#a0aec0; font-weight:400;">(${sectionAnswered}/${questions.length} answered)</span>
            </div>`;
        questions.forEach(q => {
            const shortLabel = q.short_label || q.id || '';
            const fullText   = q.full_text || q.text || shortLabel;
            const ans        = allAnswers[shortLabel] || '';
            const ansDisplay = ans || '<em style="color:#a0aec0;">Not answered</em>';
            const ansColor   = ans ? '#2d3748' : '#fc8181';
            html += `<div style="display:flex; justify-content:space-between; align-items:flex-start; padding:8px 0; border-bottom:1px solid #f0f4f8; gap:12px;">
                <div style="font-size:13px; color:#4a5568; flex:1;">${escHtml(fullText)}</div>
                <div style="font-size:13px; color:${ansColor}; font-weight:500; text-align:right; max-width:220px;">${ans ? escHtml(ans) : ansDisplay}</div>
            </div>`;
        });
        html += `</div>`;
    });
    return html;
}

// ---------------------------------------------------------------------------
// ANSWER BINDING
// ---------------------------------------------------------------------------
function bindOptionHandlers() {
    // Radio / single-select
    document.querySelectorAll('label.option-item:not([data-type="checkbox"]), label.likert-option').forEach(label => {
        label.addEventListener('click', function() {
            const shortLabel = this.dataset.short;
            const val        = this.dataset.val;
            allAnswers[shortLabel] = val;

            // Deselect siblings
            const name = this.querySelector('input').name;
            document.querySelectorAll(`label[data-short="${CSS.escape(shortLabel)}"]`).forEach(l => l.classList.remove('selected'));
            this.classList.add('selected');
            const inp = this.querySelector('input[type="radio"]');
            if (inp) inp.checked = true;
        });
    });

    // Checkboxes
    document.querySelectorAll('label.option-item[data-type="checkbox"]').forEach(label => {
        label.addEventListener('click', function(e) {
            if (e.target.tagName === 'INPUT') return; // handled by change event
            const inp = this.querySelector('input[type="checkbox"]');
            if (inp) { inp.checked = !inp.checked; inp.dispatchEvent(new Event('change')); }
        });
        const inp = label.querySelector('input[type="checkbox"]');
        if (inp) {
            inp.addEventListener('change', function() {
                const shortLabel = label.dataset.short;
                const val        = label.dataset.val;
                const currentArr = allAnswers[shortLabel] ? allAnswers[shortLabel].split('|') : [];
                if (this.checked) {
                    if (!currentArr.includes(val)) currentArr.push(val);
                    label.classList.add('selected');
                } else {
                    const idx = currentArr.indexOf(val);
                    if (idx > -1) currentArr.splice(idx, 1);
                    label.classList.remove('selected');
                }
                allAnswers[shortLabel] = currentArr.join('|');
            });
        }
    });
}

function restoreAnswers(questions) {
    // After rendering, restore saved state for already-answered questions
    questions.forEach(q => {
        const shortLabel = q.short_label || q.id || '';
        const savedVal   = allAnswers[shortLabel];
        if (!savedVal) return;

        const qType = (q.question_type || q.type || 'radio').toLowerCase();
        if (qType === 'checkbox' || qType === 'multi') {
            // handled in buildQuestionHtml
        } else {
            const inp = document.querySelector(`input[name="q_${CSS.escape(shortLabel)}"][value="${CSS.escape(savedVal)}"]`);
            if (inp) {
                inp.checked = true;
                inp.closest('label')?.classList.add('selected');
            }
        }
    });
}

// ---------------------------------------------------------------------------
// NAVIGATION
// ---------------------------------------------------------------------------
function goNext() {
    const sections = surveyData.sections || [];
    const section  = sections[currentSection];
    if (!section) return;

    // Validate — all questions in this section must have an answer
    const questions = section.questions || [];
    const unanswered = questions.filter(q => {
        const shortLabel = q.short_label || q.id || '';
        const qType = (q.question_type || q.type || 'radio').toLowerCase();
        if (qType === 'text' || qType === 'open') return false; // text is optional
        return !allAnswers[shortLabel];
    });

    if (unanswered.length > 0) {
        const errEl = document.getElementById('validationError');
        if (errEl) {
            errEl.style.display = 'block';
            errEl.textContent = `Please answer all ${unanswered.length} remaining question(s) before continuing.`;
            window.scrollTo(0, 0);
        }
        return;
    }

    currentSection++;
    showCurrentSection();
}

function goBack() {
    if (currentSection <= 0) {
        showIntro();
        return;
    }
    currentSection--;
    showCurrentSection();
}

function goBackToLastSection() {
    const sections = surveyData.sections || [];
    currentSection = sections.length - 1;
    showCurrentSection();
}

// ---------------------------------------------------------------------------
// SUBMIT
// ---------------------------------------------------------------------------
async function submitSurvey() {
    const submitBtn = document.getElementById('submitBtn');
    if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting…';
    }

    // Build final answers — send only non-empty values
    // Checkbox answers stored as "A|B|C" — convert to first value for
    // SurveySelector compatibility (multi-select not standard in Remark)
    const finalAnswers = {};
    Object.entries(allAnswers).forEach(([k, v]) => {
        if (v && v.trim()) {
            // If pipe-separated (checkbox), join with semicolon for export
            finalAnswers[k] = v.includes('|') ? v.split('|').join('; ') : v;
        }
    });

    try {
        const resp = await fetch(`/api/survey/take/${SURVEY_TOKEN}/submit`, {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ answers: finalAnswers }),
        });
        const data = await resp.json();

        if (data.success) {
            showThankYou();
        } else if (resp.status === 409) {
            // Duplicate submission
            showError('It looks like you have already submitted a response for this survey. '
                    + 'Only one response per person is allowed. Thank you!');
        } else {
            const errEl = document.getElementById('validationError');
            if (errEl) {
                errEl.style.display = 'block';
                errEl.textContent = data.error || 'An error occurred. Please try again.';
            }
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Survey ✓';
            }
        }
    } catch (err) {
        const errEl = document.getElementById('validationError');
        if (errEl) {
            errEl.style.display = 'block';
            errEl.textContent = 'Network error. Please check your connection and try again.';
        }
        if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit Survey ✓';
        }
    }
}

// ---------------------------------------------------------------------------
// PROGRESS BAR
// ---------------------------------------------------------------------------
function updateProgress(onReview = false) {
    const sections = surveyData ? surveyData.sections || [] : [];
    const container = document.getElementById('progressContainer');
    if (!container) return;
    container.style.display = 'flex';

    let pct  = 0;
    let text = '';
    if (onReview) {
        pct  = 100;
        text = 'Review & Submit';
    } else {
        pct  = sections.length > 0 ? Math.round(((currentSection) / sections.length) * 100) : 0;
        text = `Section ${currentSection + 1} of ${sections.length}`;
    }

    const fill = document.getElementById('progressFill');
    const textEl = document.getElementById('progressText');
    if (fill)   fill.style.width = pct + '%';
    if (textEl) textEl.textContent = text;
}

function hideProgress() {
    const container = document.getElementById('progressContainer');
    if (container) container.style.display = 'none';
}

// ---------------------------------------------------------------------------
// HELPERS
// ---------------------------------------------------------------------------
function getGlobalQuestionNumber(sectionIdx, questionIdx) {
    const sections = surveyData ? surveyData.sections || [] : [];
    let count = 1;
    for (let i = 0; i < sectionIdx; i++) {
        count += (sections[i].questions || []).length;
    }
    return count + questionIdx;
}

function setContent(html) {
    document.getElementById('surveyContent').innerHTML = html;
}

function escHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function escAttr(str) {
    return escHtml(str);
}

function escJs(str) {
    if (!str) return '';
    return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
}

// ---------------------------------------------------------------------------
// BOOT
// ---------------------------------------------------------------------------
document.addEventListener('DOMContentLoaded', init);
</script>
